services:
  - type: web
    name: eduguard360-building360-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    autoDeploy: true
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TS_NODE_TRANSPILE_ONLY
        value: 1
      - key: PORT
        value: 3000
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: BUILDING360_INVITE_REDIRECT_URL
        value: https://eduguard360.co.mz/auth/recovery?returnTo=%2Fbuilding360%2Fdashboard&mode=update-password
      - key: BUILDING360_AUTO_SEED
        value: 0